<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7fb">
  <meta name="description" content="유이린이 운영하는 Discord 봇의 공통 이용약관과 개인정보 처리방침입니다.">
  <title>all-bot | 정책 안내</title>
  <style>
    :root { color-scheme: light; --ink: #202238; --muted: #70748a; --accent: #6558d3; --accent-dark: #5144bd; --line: #e9e8f1; --surface: #fff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 2rem 1.25rem; color: var(--ink); background: radial-gradient(ellipse at 50% 0, #eae8ff 0, #f7f7fb 42rem); font: 1rem/1.7 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 760px); margin: 0 auto; }
    .hero { padding: clamp(2.5rem, 9vw, 5.5rem) 0 2.5rem; text-align: center; }
    .eyebrow { display: inline-block; margin: 0 0 1rem; padding: .3rem .75rem; border: 1px solid #dcd8ff; border-radius: 999px; color: var(--accent-dark); background: #f7f6ff; font-size: .82rem; font-weight: 700; letter-spacing: .04em; }
    h1 { margin: 0; font-size: clamp(2.25rem, 7vw, 3.5rem); letter-spacing: -.055em; line-height: 1.15; }
    .intro { max-width: 540px; margin: 1.1rem auto 0; color: var(--muted); }
    .policies { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    .card { display: flex; min-height: 190px; flex-direction: column; align-items: flex-start; padding: 1.5rem; border: 1px solid var(--line); border-radius: 20px; color: inherit; background: var(--surface); box-shadow: 0 12px 34px rgb(36 32 82 / 6%); text-decoration: none; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
    .card:hover, .card:focus-visible { transform: translateY(-3px); border-color: #c8c1ff; box-shadow: 0 18px 40px rgb(36 32 82 / 11%); }
    .icon { display: grid; width: 42px; height: 42px; margin-bottom: 1.1rem; place-items: center; border-radius: 13px; color: var(--accent-dark); background: #f0eeff; font-size: 1.2rem; }
    .card h2 { margin: 0; font-size: 1.18rem; letter-spacing: -.02em; }
    .card p { margin: .45rem 0 1rem; color: var(--muted); font-size: .93rem; }
    .card .arrow { margin-top: auto; color: var(--accent-dark); font-size: .9rem; font-weight: 700; }
    .operator, footer { color: var(--muted); text-align: center; }
    .operator { margin: 1.75rem 0 0; font-size: .92rem; }
    .operator strong { color: var(--ink); }
    footer { margin-top: 3.5rem; font-size: .82rem; }
    @media (max-width: 560px) { body { padding-inline: 1rem; } .hero { padding-top: 3.25rem; } .policies { grid-template-columns: 1fr; } .card { min-height: 170px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <p class="eyebrow">ALL-BOT · POLICY CENTER</p>
      <h1>정책 안내</h1>
      <p class="intro">유이린이 운영하는 Discord 봇의 공통 정책을 확인할 수 있어요. 봇별 기능과 데이터 처리 방식은 다를 수 있으니 각 봇의 안내도 함께 확인해 주세요.</p>
    </header>
    <nav class="policies" aria-label="정책 문서">
      <a class="card" href="./all-bot-terms-of-service/"><span class="icon" aria-hidden="true">§</span><h2>이용약관</h2><p>봇 이용 시 지켜야 할 기준과 서비스 안내를 확인하세요.</p><span class="arrow">약관 읽기 <span aria-hidden="true">→</span></span></a>
      <a class="card" href="./all-bot-privacy-policy/"><span class="icon" aria-hidden="true">◈</span><h2>개인정보 처리방침</h2><p>처리하는 정보와 이용 목적, 삭제 문의 방법을 확인하세요.</p><span class="arrow">방침 읽기 <span aria-hidden="true">→</span></span></a>
    </nav>
    <p class="operator">운영자 <strong>유이린</strong></p>
    <footer>문의 <a href="mailto:hipolewlr@naver.com">hipolewlr@naver.com</a></footer>
  </main>
</body>
</html>
